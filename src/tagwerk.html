<div id="app">
  <aside class="side" id="side" aria-label="Databases and folders"></aside>
  <div class="side-scrim" id="sscrim"></div>
  <div class="main">
  <header class="top">
    <div class="title-row"><button class="ibtn sidebtn" data-act="side" aria-label="Databases and folders" title="Sidebar"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11M3.3 5.5h1M3.3 7.5h1"/></svg></button><h1 id="dbTitle" data-act="sidetitle">Tagwerk</h1><span class="sync" id="sync" data-s="local">Loading</span>
      <div class="tools">
        <button class="ibtn" data-act="search" aria-label="Search" title="Search (/)"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg></button>
        <button class="ibtn" data-act="filters" id="fbtn" aria-label="Filter" title="Filter"><svg viewBox="0 0 16 16"><path d="M2 3.5h12M4.5 8h7M7 12.5h2"/></svg></button>
        <button class="ibtn" data-act="sorts" id="sbtn" aria-label="Sort" title="Sort"><svg viewBox="0 0 16 16"><path d="M5 2.5v11M2.5 11 5 13.5 7.5 11M11 13.5v-11M8.5 5 11 2.5 13.5 5"/></svg></button>
        <button class="ibtn" data-act="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 16 16"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.5"/><circle cx="6" cy="11.5" r="1.5"/></svg></button>
        <button class="newbtn" data-act="new" title="New (N)"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>New</button>
      </div>
    </div>
    <div class="searchbar" id="searchbar" hidden><label class="sfield"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input id="q" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search" aria-label="Search"></label><button class="scancel" data-act="search-close">Cancel</button></div>
    <div class="vbar"><nav class="vtabs" id="vtabs" aria-label="Views"></nav></div>
    <div class="chipbar" id="chipbar"></div>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="bbar" id="bbar"><button class="bnew" data-act="new"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="currentColor" stroke="none"/><path d="M8 4.6v6.8M4.6 8h6.8" stroke="#fff" stroke-width="1.6"/></svg>New page</button><span class="bcount" id="bcount"></span></nav>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden aria-label="Page">
  <div class="sheet-top" id="sheetTop">
    <span class="grab"></span>
    <button class="ibtn" data-act="delete" aria-label="Delete page" title="Delete page"><svg viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg></button>
    <div class="spacer"></div>
    <button class="tbtn" data-act="close">Done</button>
  </div>
  <div class="sheet-body" id="sheetBody">
    <textarea id="f-title" rows="1" placeholder="Untitled"></textarea>
    <div class="pprops" id="pprops"></div>
    <button class="addprop" data-act="addprop"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>Add a property</button>
    <div class="sep"></div>
    <textarea id="f-body" placeholder="Write notes, links, sub-steps…"></textarea>
  </div>
</aside>
<div class="menu-scrim" id="mscrim" hidden></div>
<div class="menu" id="menu" hidden></div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastBtn" hidden>Undo</button></div>
