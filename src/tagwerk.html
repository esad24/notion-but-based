<title>Tagwerk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: database header (title, view tabs, tools) over one scroll surface; menus become bottom sheets on phones */
:root{
  --bg:#fbfbfa; --surface:#ffffff; --surface-2:#f4f4f2; --hover:rgba(55,53,47,.065); --line:#e8e7e3;
  --fg:#2b2a26; --muted:#7d7b74; --faint:#a9a79f; --accent:#2383e2; --accent-fg:#ffffff; --danger:#d1453f;
  --shadow:0 10px 32px rgba(15,15,15,.14),0 0 0 1px rgba(15,15,15,.06); --scrim:rgba(15,15,15,.3);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Geist",system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gray-bg:#ebebe9; --gray-fg:#4b4a46; --brown-bg:#efe2d8; --brown-fg:#6b4a33; --orange-bg:#fbe3cd; --orange-fg:#8a4512;
  --yellow-bg:#f8edc2; --yellow-fg:#755a08; --green-bg:#dbeee0; --green-fg:#25663a; --blue-bg:#d8e7f8; --blue-fg:#1d538f;
  --purple-bg:#e7dff6; --purple-fg:#5a3a94; --pink-bg:#f7dbe8; --pink-fg:#8c2c5b; --red-bg:#f9dcdb; --red-fg:#972d2d;
  --teal-bg:#d3efec; --teal-fg:#1f625c; --cyan-bg:#d4eef6; --cyan-fg:#19607a; --indigo-bg:#dfe1f8; --indigo-fg:#3b3f95; --lime-bg:#e6f2cf; --lime-fg:#4b6214; --fuchsia-bg:#f5dcf5; --fuchsia-fg:#85298a; --slate-bg:#e1e5ea; --slate-fg:#3d4652;
  --grouped:#f2f2f7; --cell:#ffffff; --sep:rgba(60,60,67,.2); --seg-bg:rgba(118,118,128,.12); --seg-bg-strong:rgba(120,120,128,.2); --green-sw:#34c759;
  --kb:0px; --safe-b:0px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191919; --surface:#222222; --surface-2:#262626; --hover:rgba(255,255,255,.06); --line:#2f2f2f;
  --fg:#e7e6e3; --muted:#9b9a96; --faint:#6c6b68; --accent:#2383e2; --accent-fg:#ffffff; --danger:#eb5d57;
  --shadow:0 12px 36px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.09); --scrim:rgba(0,0,0,.55);
  --gray-bg:#3b3b3b; --gray-fg:#d6d5d2; --brown-bg:#4b3a2e; --brown-fg:#e6cbb4; --orange-bg:#5e3a1c; --orange-fg:#f6bb8a;
  --yellow-bg:#55491d; --yellow-fg:#f1d888; --green-bg:#24432f; --green-fg:#9fdbb1; --blue-bg:#1e3a5d; --blue-fg:#9cc6f6;
  --purple-bg:#3f305b; --purple-fg:#cbb4f3; --pink-bg:#572a41; --pink-fg:#f3aaca; --red-bg:#5c2727; --red-fg:#f6a5a3;
  --teal-bg:#1f4542; --teal-fg:#8fdcd2; --cyan-bg:#1c4150; --cyan-fg:#93d6ee; --indigo-bg:#2e3160; --indigo-fg:#b4b8f5; --lime-bg:#3a4520; --lime-fg:#c6e48e; --fuchsia-bg:#522a55; --fuchsia-fg:#eeaaf0; --slate-bg:#343a42; --slate-fg:#c5ccd6;
  --grouped:#1c1c1e; --cell:#2c2c2e; --sep:rgba(84,84,88,.6); --seg-bg:rgba(118,118,128,.24); --seg-bg-strong:rgba(120,120,128,.36); --green-sw:#30d158;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#191919; --surface:#222222; --surface-2:#262626; --hover:rgba(255,255,255,.06); --line:#2f2f2f;
  --fg:#e7e6e3; --muted:#9b9a96; --faint:#6c6b68; --accent:#2383e2; --accent-fg:#ffffff; --danger:#eb5d57;
  --shadow:0 12px 36px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.09); --scrim:rgba(0,0,0,.55);
  --gray-bg:#3b3b3b; --gray-fg:#d6d5d2; --brown-bg:#4b3a2e; --brown-fg:#e6cbb4; --orange-bg:#5e3a1c; --orange-fg:#f6bb8a;
  --yellow-bg:#55491d; --yellow-fg:#f1d888; --green-bg:#24432f; --green-fg:#9fdbb1; --blue-bg:#1e3a5d; --blue-fg:#9cc6f6;
  --purple-bg:#3f305b; --purple-fg:#cbb4f3; --pink-bg:#572a41; --pink-fg:#f3aaca; --red-bg:#5c2727; --red-fg:#f6a5a3;
  --teal-bg:#1f4542; --teal-fg:#8fdcd2; --cyan-bg:#1c4150; --cyan-fg:#93d6ee; --indigo-bg:#2e3160; --indigo-fg:#b4b8f5; --lime-bg:#3a4520; --lime-fg:#c6e48e; --fuchsia-bg:#522a55; --fuchsia-fg:#eeaaf0; --slate-bg:#343a42; --slate-fg:#c5ccd6;
  --grouped:#1c1c1e; --cell:#2c2c2e; --sep:rgba(84,84,88,.6); --seg-bg:rgba(118,118,128,.24); --seg-bg-strong:rgba(120,120,128,.36); --green-sw:#30d158;
  color-scheme:dark;
}
.c-gray{--tbg:var(--gray-bg);--tfg:var(--gray-fg)} .c-brown{--tbg:var(--brown-bg);--tfg:var(--brown-fg)}
.c-orange{--tbg:var(--orange-bg);--tfg:var(--orange-fg)} .c-yellow{--tbg:var(--yellow-bg);--tfg:var(--yellow-fg)}
.c-green{--tbg:var(--green-bg);--tfg:var(--green-fg)} .c-blue{--tbg:var(--blue-bg);--tfg:var(--blue-fg)}
.c-purple{--tbg:var(--purple-bg);--tfg:var(--purple-fg)} .c-pink{--tbg:var(--pink-bg);--tfg:var(--pink-fg)}
.c-red{--tbg:var(--red-bg);--tfg:var(--red-fg)}
.c-teal{--tbg:var(--teal-bg);--tfg:var(--teal-fg)} .c-cyan{--tbg:var(--cyan-bg);--tfg:var(--cyan-fg)} .c-indigo{--tbg:var(--indigo-bg);--tfg:var(--indigo-fg)} .c-lime{--tbg:var(--lime-bg);--tfg:var(--lime-fg)} .c-fuchsia{--tbg:var(--fuchsia-bg);--tfg:var(--fuchsia-fg)} .c-slate{--tbg:var(--slate-bg);--tfg:var(--slate-fg)} .c-none{--tbg:var(--surface-2);--tfg:var(--muted)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
.ph{color:var(--faint)}
.spacer{flex:1}

#app{height:100%;display:flex;flex-direction:column}
.top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;border-bottom:1px solid var(--line);flex:none;background:var(--bg)}
.title-row{display:flex;align-items:center;gap:8px;min-height:44px}
.title-row h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sync{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:12px;white-space:nowrap;flex:none}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green-fg)}
.sync[data-s="saving"]::before{background:var(--yellow-fg)}
.sync[data-s="local"]::before{background:var(--faint)}
.sync[data-s="error"]::before{background:var(--danger)}
.tools{display:flex;align-items:center;gap:2px;flex:none;margin-left:auto}
.ibtn{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;color:var(--muted);position:relative;flex:none}
.ibtn:hover{background:var(--hover);color:var(--fg)}
.ibtn.on{color:var(--accent)}
.ibtn.on::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.newbtn{display:flex;align-items:center;gap:4px;height:32px;padding:0 12px 0 10px;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:500;white-space:nowrap;margin-left:6px}
.searchbar{display:flex;align-items:center;gap:12px;padding-block:6px 4px}
.sfield{flex:1;display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;background:var(--seg-bg);color:var(--muted);min-width:0}
.sfield input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%;color:var(--fg)}
.sfield input::placeholder{color:var(--muted)}
.sfield input::-webkit-search-cancel-button{-webkit-appearance:none}
.scancel{color:var(--accent);font-weight:500;height:36px}
.vbar{display:flex;align-items:center;min-width:0;padding-block:8px 12px}
.vtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;overscroll-behavior-x:contain}
.vtabs::-webkit-scrollbar{display:none}
.vtab{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:var(--seg-bg);color:var(--fg);font-weight:500;white-space:nowrap;flex:none;font-size:14px}
.vtab svg{opacity:.7}
.vtab[aria-current="true"]{background:var(--fg);color:var(--bg)}
.vtab[aria-current="true"] svg{opacity:1}
.vtab.plus{padding:0;width:34px;justify-content:center;color:var(--muted)}
.chipbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:12px;margin-top:-2px}
.chipbar::-webkit-scrollbar{display:none}
.chipbar:empty{display:none}
.fchip{display:flex;align-items:center;gap:5px;height:28px;padding:0 12px;border-radius:14px;color:var(--accent);font-size:13px;font-weight:500;white-space:nowrap;flex:none;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.fchip svg{width:13px;height:13px}

#view{flex:1;overflow-x:hidden;overflow-y:auto;min-height:0;position:relative;overscroll-behavior:none}
#view.v-table{overflow:hidden}
/* vertical and horizontal scrolling live on separate nested scrollers, so every swipe moves along one axis only */
.hx{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain}
.bbar{display:none}

/* tags & values */
.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font-size:12.5px;background:var(--tbg);color:var(--tfg);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;line-height:20px;flex:none}
.tag.st{border-radius:10px;padding:0 8px 0 7px}
.tag.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px;opacity:.85;flex:none}
.dt{color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.dt.overdue{color:var(--danger)}
.pv .dt{white-space:normal}
.stamp,.num-v{font-variant-numeric:tabular-nums;white-space:nowrap}
.num-v{margin-left:auto}
.lnk-u{color:inherit;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px;overflow-wrap:anywhere}
.cbx{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--faint);display:inline-grid;place-items:center;color:transparent;flex:none}
.cbx svg{width:11px;height:11px;stroke-width:2.4}
.cbx.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tx{overflow-wrap:anywhere}
.ti{font-family:var(--mono);font-size:11px;font-weight:500;width:16px;text-align:center;flex:none;letter-spacing:-.04em}

.chk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;color:transparent;position:relative}
.chk::after{content:"";position:absolute;inset:-12px}
.chk svg{width:11px;height:11px;stroke-width:2.4}
.done .chk{background:var(--green-fg);border-color:var(--green-fg);color:var(--bg)}
.done .t-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}

/* table */
.th{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 8px;color:var(--muted);border-right:1px solid var(--line);position:relative;white-space:nowrap;cursor:pointer;font-size:13.5px;user-select:none;-webkit-user-select:none}
.th .nm{overflow:hidden;text-overflow:ellipsis}
.th .arr{font-family:var(--mono);font-size:11px;color:var(--accent)}
.th.add{width:44px;justify-content:center;border-right:0}
.rs{position:absolute;right:-4px;top:0;bottom:0;width:8px;cursor:col-resize;touch-action:none;z-index:2}
.rs::after{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:2px;border-radius:1px;background:var(--accent);opacity:0}
.rs.on::after{opacity:1}
.tr{display:flex;border-bottom:1px solid var(--line);min-width:100%;content-visibility:auto;contain-intrinsic-block-size:auto 37px}
.tr.tint{background:color-mix(in srgb,var(--tbg) 34%,var(--bg))}
.td{flex:none;min-height:36px;padding:7px 8px;border-right:1px solid var(--line);display:flex;align-items:flex-start;flex-wrap:wrap;gap:4px;cursor:pointer;min-width:0;overflow:hidden}
.td.title{font-weight:500}
.td.title .t-title{overflow-wrap:anywhere}
.td.add{width:44px;border-right:0}
.tr-new{display:flex;align-items:center;gap:8px;height:38px;padding:0 8px;color:var(--muted);cursor:pointer;border-bottom:1px solid var(--line)}
.tfoot{color:var(--faint);font-size:12px;padding-block:8px;padding-left:max(24px,calc(env(safe-area-inset-left,0px) + 8px));font-variant-numeric:tabular-nums}
.tfoot b{color:var(--muted);font-weight:500}

/* board */
.board{display:flex;gap:12px;align-items:flex-start;padding-block:14px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:max-content;min-height:100%}
.col{width:272px;flex:none;border-radius:10px;padding:8px;background:color-mix(in srgb,var(--tbg) 24%,var(--bg));display:flex;flex-direction:column;gap:6px}
.col.c-none{background:var(--surface-2)}
.col-h{display:flex;align-items:center;gap:6px;padding:2px 2px 4px;min-height:30px}
.col-h .tag{font-weight:500;font-size:13px}
.col-h .count{color:var(--muted);font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.col-h .ibtn{width:28px;height:28px}
.col-body{display:flex;flex-direction:column;gap:6px;min-height:8px}
.card{position:relative;border-radius:8px;padding:9px 10px 10px;background:color-mix(in srgb,var(--tbg) 52%,var(--surface));box-shadow:0 0 0 1px color-mix(in srgb,var(--fg) 7%,transparent);cursor:pointer;display:flex;gap:8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;contain:layout paint}
.card.c-none{background:var(--surface)}
.card .chk{margin-top:1px}
.card-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.t-title{font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.cprops{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px}
.cp{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
.cp.full{flex-basis:100%;color:var(--muted)}
.cp.full .dt{color:var(--muted)}
.cp.full .dt.overdue{color:var(--danger)}
.col-add{display:flex;align-items:center;gap:6px;color:var(--muted);height:32px;padding:0 6px;border-radius:6px;text-align:left}
.col-add:hover{background:var(--hover);color:var(--fg)}
.col-new{width:220px;flex:none}
.col-new .col-add{width:100%;border:1px dashed var(--line);justify-content:center;height:42px}
.drop-line{height:2px;border-radius:2px;background:var(--accent);margin:-4px 2px;pointer-events:none}
.over{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:-2px}
.dragging{opacity:.35}
.ghost{position:fixed;z-index:60;pointer-events:none;transform:rotate(2deg) scale(1.02);box-shadow:var(--shadow);opacity:.97;margin:0;will-change:left,top}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
.blank{max-width:420px;margin:48px auto;padding-inline:16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.blank b{color:var(--fg);font-weight:500;font-size:15px}
.btn{height:34px;padding:0 14px;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:500}

/* calendar */
.cal{display:flex;flex-direction:column;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 140px}
.cal-h{display:flex;align-items:center;gap:6px;padding-bottom:10px;flex-wrap:wrap}
.cal-h h2{font-size:18px;font-weight:600;letter-spacing:-.015em;margin:0 8px 0 2px;min-width:150px}
.pillbtn{height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line);color:var(--fg);display:flex;align-items:center;gap:6px;white-space:nowrap}
.pillbtn:hover{background:var(--hover)}
.pillbtn .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{height:26px;padding:0 10px;border-radius:6px;color:var(--muted);font-size:12.5px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--fg)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{color:var(--muted);font-size:12px;text-align:center;padding:4px 0 6px}
.grid{border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:6px;overflow:hidden}
.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:118px;padding:4px;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--bg)}
.day.out{background:var(--surface-2)}
.day.out .num{color:var(--faint)}
.day-h{display:flex;align-items:center;justify-content:flex-end;gap:4px;height:24px}
.num{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:24px;height:24px;display:grid;place-items:center;border-radius:12px;padding:0 4px;cursor:pointer}
.day.today .num{background:var(--danger);color:#fff;font-weight:600}
.day.sel{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}
.day-add{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:0;margin-right:auto}
.day:hover .day-add{opacity:1}
.day-items{display:flex;flex-direction:column;gap:4px;min-width:0}
.ev{border-radius:6px;padding:5px 7px 6px;background:color-mix(in srgb,var(--tbg) 62%,var(--surface));cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 0 0 1px color-mix(in srgb,var(--fg) 6%,transparent)}
.ev.c-none{background:var(--surface)}
.ev .t-title{font-size:12.5px;font-weight:600}
.ev-meta{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.ev-meta .tag{height:18px;line-height:18px;font-size:11.5px}
.ev .time{font-family:var(--mono);font-size:11px;color:var(--tfg)}
.ev.done{opacity:.6}
.agenda{display:none}
.tg{--hh:48px;--gut:52px}
.tg-row{display:grid;grid-template-columns:var(--gut) repeat(var(--n),minmax(0,1fr))}
.tg-top{position:sticky;top:0;z-index:5;background:var(--bg)}
.tg-dh{padding:6px 2px 8px;text-align:center;color:var(--muted);font-size:12px;border-left:1px solid var(--line);cursor:pointer;min-width:0}
.tg-dh b{display:grid;place-items:center;width:32px;height:32px;margin:2px auto 0;border-radius:16px;font-size:18px;font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.tg-dh.today b{background:var(--danger);color:#fff;font-weight:600}
.tg-all{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tg-allc{border-left:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:3px;min-height:32px;min-width:0;cursor:cell}
.tg-allc .ev{padding:3px 6px}
.tg-allc .ev .ev-meta{display:none}
.gut{font-size:10.5px;color:var(--faint);text-align:right;padding-right:6px;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.tg-all .gut{align-self:center;font-family:var(--font)}
.tg-body .gut{position:relative}

// ---------- state ----------
const S = {

const statusProp = () => S.schema.props.find(p => p.type === 'status');
const groupOpt = (p, g) => p && p.options && (p.options.find(o => o.group === g) || null);

// ---------- dates ----------
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => keyOf(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const toMin = s => { const [a, b] = (s || '0:0').split(':').map(Number); return a * 60 + b; };
const fromMin = m => { m = Math.max(0, Math.min(1439, Math.round(m))); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
function relDate(k){
  if (!k) return '';

  const diff = Math.round((d - t) / 864e5);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  const wd = d.toLocaleDateString('en-US', {weekday:'long'});
  if (diff > 1 && diff < 7) return wd;
  if (diff < -1 && diff > -8) return 'Last ' + wd;

// a date value is {d, t, ed, e}: start date/time and end date/time; an empty time means "no time".

const endDay = v => (v && (v.ed || (v.e ? v.d : ''))) || '';

// ---------- conditions (filters + color rules) ----------
const OPS = {

  multi:[['contains','contains',1],['not_contains','does not contain',1],['empty','is empty',0],['not_empty','is not empty',0]],
  checkbox:[['checked','is checked',0],['unchecked','is not checked',0]],

function opsFor(type){
  if (type === 'number') return OPS.number;
  if (type === 'select' || type === 'status') return OPS.select;

  if (type === 'checkbox') return OPS.checkbox;
  if (IS_DATEISH(type)) return OPS.date;

function ruleReady(c){
  const p = P(c.prop); if (!p) return false;
  const op = opsFor(p.type).find(o => o[0] === c.op);
  return !!op && !(op[2] && (c.val === '' || c.val == null));
}
function test(c, t){
  if (!ruleReady(c)) return true;
  const p = P(c.prop), ops = opsFor(p.type);
  const v = getV(t, p), e = isEmpty(p, v);
  if (c.op === 'empty') return e;

  switch (ops) {
    case OPS.text: {
      const s = String(v || '').toLowerCase(), q = String(c.val || '').toLowerCase();
      return c.op === 'contains' ? s.includes(q) : c.op === 'not_contains' ? !s.includes(q) : c.op === 'is' ? s === q : c.op === 'is_not' ? s !== q : s.startsWith(q);
    }
    case OPS.number: {
      if (e) return false; const n = +v, x = parseFloat(String(c.val).replace(',', '.'));
      return {eq:n === x, ne:n !== x, gt:n > x, lt:n < x, gte:n >= x, lte:n <= x}[c.op];
    }
    case OPS.select: return c.op === 'is' ? v === c.val : v !== c.val;
    case OPS.multi: { const has = (v || []).includes(c.val); return c.op === 'contains' ? has : !has; }

function sk(p, t){

    case 'multi_select': { const ix = (v || []).map(x => (p.options || []).findIndex(o => o.id === x)).filter(i => i >= 0); return ix.length ? Math.min(...ix) : null; }

// ---------- persistence ----------
const CACHE = 'tagwerk:v2';

function cacheLocal(){

}

function setSync(s, label){ const el = $('#sync'); el.dataset.s = s; el.textContent = label; }

function persist(id, delay = 0){

    timers.delete(id);
    const cur = S.tasks.get(id); if (!cur) return;

function saveMeta(which){

const saveSchema = () => saveMeta('schema');
const saveViews = () => saveMeta('views');

function migrateTask(id, d){
  if (d.p) return {...d, id};
  const sMap = {'Nicht begonnen':'nb','In Arbeit':'ia','Erledigt':'er'}, pMap = {'Sehr hoch':'sh','Hoch':'h','Mittel-hoch':'mh','Mittel':'m','Niedrig':'n'};

  if (d.priority) p.priority = pMap[d.priority] || d.priority;

async function connect(){
  let api = null;
  try { api = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { api = null; }
  if (!api) { refreshSync(); return; }
  db = api; refreshSync();
  db.collection('tasks').onSnapshot(snap => {
    if (snap.metadata.fromCache && snap.empty) return;
    let changed = false;
    const next = new Map();
    for (const d of snap.docs) {
      const b = d.data(); if (!b) continue;
      const t = migrateTask(d.id, b), cur = S.tasks.get(d.id);
      if (cur && stable(cur) === stable(t)) next.set(d.id, cur); else { next.set(d.id, t); changed = true; }
    }
    for (const id of timers.keys()) { const l = S.tasks.get(id); if (l) next.set(id, l); }
    for (const id of busy.keys()) { const l = S.tasks.get(id); if (l && !next.has(id)) next.set(id, l); }
    for (const id of S.drafts) { const l = S.tasks.get(id); if (l) next.set(id, l); }
    if (!changed && next.size === S.tasks.size) return; // only our own writes echoed back
    S.tasks = next; cacheSoon(); render();
  }, e => { console.error(e); setSync('error', 'Offline'); });
  db.doc('meta/schema').onSnapshot(snap => {
    if (metaBusy('schema')) return;
    const b = snap.exists && snap.data();
    if (b && Array.isArray(b.props) && stable(b) !== stable(S.schema)) { S.schema = clone(b); cacheSoon(); render(); if (MN.stack.length) redrawMenu(); }
  }, e => console.error(e));
  db.doc('meta/views').onSnapshot(snap => {
    if (metaBusy('views')) return;
    const b = snap.exists && snap.data();
    if (b && Array.isArray(b.views) && b.views.length && stable(b.views) !== stable(S.views)) {
      S.views = clone(b.views); if (!S.views.some(v => v.id === S.vid)) S.vid = S.views[0].id; cacheSoon(); render(); if (MN.stack.length) redrawMenu();
    }
  }, e => console.error(e));
}

function nextColor(p){ return COLORS[((p.options || []).length + 3) % COLORS.length]; }

function convertVal(p, from, to, v){

    switch (from) {

    case 'number': { const n = parseFloat(String(s).replace(',', '.')); return isNaN(n) ? undefined : n; }
    case 'select': case 'status': case 'multi_select': {

  if (type === 'status') p.options.forEach(o => { o.group = o.group || 'todo'; });
  p.type = from; // conversion reads options under the old type

    const nv = convertVal(p, from, type, v);

function addProp(type, name, afterId, beforeId){

// small list sorter used for properties, options and color rules (drag the grip)
function sortable(list, onDone){
  list.addEventListener('pointerdown', e => {
    const hd = e.target.closest('.hdl'); if (!hd) return;
    const item = hd.closest('[data-key]'); if (!item) return;
    e.preventDefault(); hd.setPointerCapture(e.pointerId); item.classList.add('lifting');
    const move = ev => {
      const y = ev.clientY;
      const sibs = [...list.querySelectorAll(':scope > [data-key]')].filter(s => s !== item);
      const before = sibs.find(s => { const r = s.getBoundingClientRect(); return y < r.top + r.height / 2; });
      if (before) { if (item.nextElementSibling !== before) list.insertBefore(item, before); }
      else if (list.lastElementChild !== item) list.appendChild(item);
    };
    const up = () => {
      hd.removeEventListener('pointermove', move); hd.removeEventListener('pointerup', up); hd.removeEventListener('pointercancel', up);
      item.classList.remove('lifting');
      onDone([...list.querySelectorAll(':scope > [data-key]')].map(x => x.dataset.key));
    };
    hd.addEventListener('pointermove', move); hd.addEventListener('pointerup', up); hd.addEventListener('pointercancel', up);
  });
}

const condVal = (p, val) => {
  if (!p) return '';
  if (HAS_OPTS(p.type)) return `<select data-f="val" aria-label="Value"><option value="">Choose…</option>${(p.options || []).map(o => `<option value="${o.id}"${o.id === val ? ' selected' : ''}>${h(o.name)}</option>`).join('')}</select>`;
  if (IS_DATEISH(p.type)) return `<input type="date" data-f="val" value="${h(val || '')}" aria-label="Date">`;
  if (p.type === 'number') return `<input data-f="val" inputmode="decimal" value="${h(val ?? '')}" placeholder="Value" aria-label="Value" enterkeyhint="done">`;
  return `<input data-f="val" value="${h(val ?? '')}" placeholder="Value" autocomplete="off" aria-label="Value" enterkeyhint="done">`;
};
function condRow(c, i, withColor){
  const p = P(c.prop), ops = opsFor(p ? p.type : 'text'), op = ops.find(o => o[0] === c.op) || ops[0];
  return `<div class="grp"${withColor ? ` data-key="${c.id}"` : ''}><div class="rule" data-i="${i}">
    ${withColor ? `<span class="hdl">${IC.grip}</span><button class="swsel c-${c.color}" data-f="color" title="Color: ${colorName(c.color)}" aria-label="Color: ${colorName(c.color)}"></button>` : ''}
    <select data-f="prop" aria-label="Property">${S.schema.props.map(pp => `<option value="${pp.id}"${pp.id === c.prop ? ' selected' : ''}>${h(pp.name)}</option>`).join('')}</select>
    <select data-f="op" aria-label="Condition">${ops.map(o => `<option value="${o[0]}"${o[0] === op[0] ? ' selected' : ''}>${o[1]}</option>`).join('')}</select>
    ${op[2] ? condVal(p, c.val) : ''}
    <button class="ibtn" data-f="del" aria-label="Remove">${IC.trash}</button></div></div>`;
}
function bindRules(c, arr, save){
  let t = 0;
  c.addEventListener('change', e => {
    const f = e.target.dataset.f, row = e.target.closest('.rule'); if (!f || !row) return;
    const r = arr()[+row.dataset.i]; if (!r) return;
    if (f === 'prop') { r.prop = e.target.value; r.op = opsFor(P(r.prop).type)[0][0]; r.val = ''; save(); redrawMenu(); }
    else if (f === 'op') { r.op = e.target.value; const o = opsFor(P(r.prop).type).find(x => x[0] === r.op); if (!o[2]) r.val = ''; save(); redrawMenu(); }
    else if (f === 'val') { r.val = e.target.value; save(); }
  });
  c.addEventListener('input', e => {
    if (e.target.dataset.f !== 'val' || e.target.tagName !== 'INPUT' || e.target.type === 'date') return;
    const r = arr()[+e.target.closest('.rule').dataset.i]; if (!r) return; r.val = e.target.value;
    clearTimeout(t); t = setTimeout(save, 200);
  });
  c.addEventListener('click', e => {
    const sw = e.target.closest('[data-f="color"]');
    if (sw) { const i = +sw.closest('.rule').dataset.i; return pushMenu(colorPickPage(arr()[i].color, k => { const r = arr()[i]; if (r) { r.color = k; save(); } })); }
    const b = e.target.closest('[data-f="del"]'); if (!b) return;
    arr().splice(+b.closest('.rule').dataset.i, 1); save(); redrawMenu();
  });
}
